<div class="question-list-body">
    <h1 class="question-list-headline">Fragenliste</h1>
    <div class="question-list-headline-button">
        <a class="btn btn-secondary" href="#">Mit erster Frage starten</a>
    </div>


    @for(question of questions(); track question.id){
    <div class="question-list-card">
        <p class="question-list-question">{{question.questionText}}</p>
        @for (answer of question.answers; track answer.id){
        <div class="question-list-answer-card">
            <div class="question-list-answer-number">{{answer.id}}</div>
            <div class="question-list-answer">{{answer.answerText}}</div>

        </div>
        }
        <div class="question-list-card-buttons">
        <a class="btn btn-secondary list-card-button" href="#">Öffnen</a>
        <a class="btn btn-secondary list-card-button" href="#">Lösung anzeigen</a>
    
    </div>
    </div>
    }
</div>
